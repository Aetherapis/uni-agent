# ---------------------------------------------------------------- Dorm buses
# Dorm shuttle. Confirmed by you:
#   campus -> dorms: leaves campus 15:30 and 17:30, reaches the dorms 16:30 and 18:30  (60 min ride)
#   dorms -> campus: leaves the dorms 06:40 and 08:40. The arrival time on campus is ASSUMED to be
#   the same 60 min (07:40 / 09:40). If the morning ride is longer, change `ride_min` at the top.
[[buses]]
route = "Dorms bus"
direction = "to_campus"
depart = "06:40"                 # arrives 07:40 (assumed)
days = ["sat", "sun", "tue", "wed"]

[[buses]]
route = "Dorms bus"
direction = "to_campus"
depart = "08:40"                 # arrives 09:40 (assumed)
days = ["sat", "sun", "tue", "wed"]

