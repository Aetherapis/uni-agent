# EXAMPLE timetable with fictional room numbers, groups and course codes, but the same weekly shape as the
# real one (Sat/Sun/Tue/Wed classes, biweekly Sunday lecture, dorm buses). The tests run on this file.
# Your REAL timetable lives in seed/timetable.toml (git-ignored) and is imported into Notion once.

# Bus ride time in minutes (ASSUMED - see the bus section at the bottom). Must stay above all [tables].
ride_min = 60

# A "slot"/"period" is a fixed time block, so sessions below just say which period they're in.
[periods]
1 = ["08:30", "10:00"]
2 = ["10:15", "11:45"]
3 = ["12:00", "13:30"]
4 = ["13:45", "15:15"]
5 = ["15:45", "17:15"]
6 = ["17:45", "19:15"]
7 = ["19:45", "21:15"]

