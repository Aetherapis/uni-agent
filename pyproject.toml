[project]
name = "uniagent"
version = "0.1.0"
description = "University task & schedule agent that writes to Habitica"
requires-python = ">=3.11"
dependencies = []          # later parts add: requests, google-genai

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uniagent = ["assets/*.oga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
